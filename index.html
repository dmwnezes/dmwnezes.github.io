<script>
  // Links antigos do Palavreiro na raiz (?mp=, ?d=, #rota) continuam indo para /termo/.
  if (/[?&](mp|d)=/.test(location.search) || location.hash.length > 1) {
    location.replace("/termo/" + location.search + location.hash);
  }
</script>

<style>
  :root {
    --bg: #101216; --surface: #1B1E24; --surface-high: #242830;
    --text: #F1F2F4; --muted: #9AA0AA; --accent: #C6F36B;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: Sora, system-ui, sans-serif; color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(16px, 4.5vh, 56px) 16px clamp(12px, 2.5vh, 28px);
  }

  /* Bandeira do Brasil em quadradinhos (a mesma da abertura do Palavreiro), tremulando em loop */
  .flag { display: grid; grid-template-columns: repeat(7, 8px); gap: 2px; margin-bottom: clamp(12px, 3vh, 28px); }
  .flag i { width: 8px; height: 8px; border-radius: 2.5px; background: #5FB873;
            animation: tremula 1.26s ease-in-out infinite; animation-delay: calc(var(--c) * -0.14s); }
  .flag i.y { background: #E6C14F; } .flag i.b { background: #4A72CF; }
  @keyframes tremula { 0%, 100% { transform: translateY(-1.6px); } 50% { transform: translateY(1.6px); } }
  .avatar {
    width: clamp(68px, 12.5vh, 104px); height: clamp(68px, 12.5vh, 104px); border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent);
  }
  h1 { font-size: 22px; font-weight: 700; margin-top: clamp(10px, 2.2vh, 20px); }
  .sub { font-size: 14px; color: var(--muted); margin-top: 6px; }

  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 12px); margin-top: clamp(16px, 3.5vh, 32px); }
  .link {
    display: flex; align-items: center; gap: 14px; padding: clamp(9px, 1.6vh, 14px) 14px;
    border-radius: 22px; background: var(--surface); color: inherit; text-decoration: none;
    transition: transform .2s ease, background .2s ease;
  }
  .link:hover, .link:focus-visible { background: var(--surface-high); transform: translateY(-2px); outline: none; }
  .link:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .ico { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
  .txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .txt b { font-size: 16px; font-weight: 600; }
  .txt small { font-size: 13px; color: var(--muted); }
  .arrow { color: var(--accent); font-size: 20px; transition: transform .2s ease; }
  .link:hover .arrow { transform: translateX(3px); }

  .i-palavreiro { background: #2A2058; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 10px; }
  .i-palavreiro i { border-radius: 4px; width: 100%; height: 100%; }
  .i-bussola { background: #E6E3DD; }
  .i-cegas { background: #262A35; color: #D8B45A; font-size: 24px; font-weight: 700; }

  footer { margin-top: auto; padding-top: clamp(16px, 3.5vh, 40px); font-size: 13px; color: var(--muted); }
  footer a { display: flex; align-items: center; gap: 10px; min-height: 44px; color: inherit; text-decoration: none; }
  footer a:hover, footer a:focus-visible { color: var(--text); outline: none; }
  .insta { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
  footer a:hover .insta, footer a:focus-visible .insta { background: var(--surface-high); box-shadow: 0 0 0 2px var(--accent); }
  @media (prefers-reduced-motion: reduce) { .flag i, #b3, #b3 .corpo, .broto svg, .broto .sprout { animation: none !important; } .link, .arrow { transition: none; } .link:hover { transform: none; } }

  /* Broto: o mascote (M2). Fica pelo site e reage ao toque. */
  html, body { overflow-x: clip; }
  .slot { position: relative; }
  .slot .link { position: relative; z-index: 1; }
  footer { position: relative; }
  .broto {
    position: absolute; width: 44px; height: 44px; padding: 0; border: 0; background: none;
    display: grid; place-items: center; cursor: pointer; z-index: 2; -webkit-tap-highlight-color: transparent;
  }
  .broto:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
  .broto .corpo { display: block; }
  .broto svg { display: block; width: 26px; height: 33px; overflow: visible; transition: transform .25s ease; }
  .broto .olhos { transition: transform .12s linear; }
  .broto .closed, .broto .zzz { display: none; }
  .broto.blink .open, .broto.sleep .open { display: none; }
  .broto.blink .closed, .broto.sleep .closed, .broto.sleep .zzz { display: inline; }
  .broto.pula svg { animation: pula .55s ease; }
  .broto.gira .sprout { transform-box: fill-box; transform-origin: 0% 100%; animation: gira .7s ease; }
  .broto.treme svg { animation: treme .4s linear; }
  .broto.some svg { transform: scale(0); }
  .bubble {
    position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 4px);
    white-space: nowrap; background: var(--text); color: var(--bg); font: 600 12px Sora, system-ui, sans-serif;
    padding: 6px 10px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .bubble.on { opacity: 1; transform: translate(-50%, -2px); }
  #b1 { right: 56px; top: -37px; }
  #b2 { right: -24px; top: 50%; margin-top: -22px; z-index: 0; }
  #b2 svg { transform: rotate(14deg); }
  #b2 .bubble { left: auto; right: 0; transform: translate(0, 4px); }
  #b2 .bubble.on { transform: translate(0, -2px); }
  #b3 { left: -54px; bottom: 0; animation: passeio 10s ease-in-out infinite; }
  #b3 .corpo { animation: vira 10s steps(1) infinite; }
  @keyframes passeio { 0%, 100% { transform: translateX(0); } 45%, 50% { transform: translateX(-34px); } }
  @keyframes vira { 0% { transform: scaleX(-1); } 50% { transform: scaleX(1); } }
  @keyframes pula { 0%, 100% { transform: none; } 20% { transform: scale(1.15, .85); } 50% { transform: translateY(-14px) scale(.95, 1.05); } 80% { transform: scale(1.1, .9); } }
  @keyframes gira { to { transform: rotate(360deg); } }
  @keyframes treme { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

<script>
// Broto: olhos seguem o dedo/mouse, pisca sozinho, dorme de 0h a 5h e reage ao toque.
(() => {
  const brotos = [...document.querySelectorAll(".broto")];
  const falas = ["oi!", "bora um Termo?", "tô de olho em você", "psiu!", "me rega, por favor", "BROTO tem 5 letras", "Vai, Fortaleza!", "cuidado, eu mordo", "já votou às cegas?"];
  const dormindo = () => new Date().getHours() < 5;
  const anim = (b, cls, ms) => { b.classList.remove(cls); void b.offsetWidth; b.classList.add(cls); setTimeout(() => b.classList.remove(cls), ms); };
  const fala = (b, txt) => {
    const el = b.querySelector(".bubble"); el.textContent = txt; el.classList.add("on");
    clearTimeout(b._fala); b._fala = setTimeout(() => el.classList.remove("on"), 1800);
  };
  brotos.forEach((b) => {
    b._toques = 0;
    b.classList.toggle("sleep", dormindo());
    (function piscar() {
      setTimeout(() => { if (!b.classList.contains("sleep")) anim(b, "blink", 160); piscar(); }, 2500 + Math.random() * 4000);
    })();
    b.addEventListener("click", () => {
      if (b.classList.contains("sleep")) {
        b.classList.remove("sleep"); anim(b, "pula", 550); fala(b, "hã? tô acordado!");
        setTimeout(() => b.classList.toggle("sleep", dormindo()), 5000); return;
      }
      b._toques++; clearTimeout(b._zera); b._zera = setTimeout(() => (b._toques = 0), 2500);
      if (b._toques >= 5) {
        b._toques = 0; fala(b, "chega! vou me esconder"); anim(b, "treme", 400);
        setTimeout(() => b.classList.add("some"), 600);
        setTimeout(() => { b.classList.remove("some"); fala(b, "voltei :)"); }, 3500); return;
      }
      anim(b, ["pula", "gira", "pula", "treme"][Math.floor(Math.random() * 4)], 700);
      fala(b, falas[Math.floor(Math.random() * falas.length)]);
    });
  });
  addEventListener("pointermove", (e) => {
    brotos.forEach((b) => {
      const r = b.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy) || 1;
      b.querySelector(".olhos").style.transform = `translate(${(dx / d) * 1.8}px, ${(dy / d) * 1.4}px)`;
    });
  }, { passive: true });
})();
</script>
