<style>
  :root {
    --bg: #101216; --surface: #1B1E24; --surface-high: #242830;
    --text: #F1F2F4; --muted: #9AA0AA; --accent: #C6F36B;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: Sora, system-ui, sans-serif; color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(16px, 4.5vh, 56px) 16px clamp(12px, 2.5vh, 28px);
    transition: background-color .25s ease-out;
  }
  html.clarao body { background: #23272F; transition: none; }

  /* Bandeira do Brasil em quadradinhos (a mesma da abertura do Palavreiro), tremulando em loop */
  .flag { display: grid; grid-template-columns: repeat(7, 8px); gap: 2px; margin-bottom: clamp(12px, 3vh, 28px); }
  .flag i { width: 8px; height: 8px; border-radius: 2.5px; background: #5FB873;
            animation: tremula 1.26s ease-in-out infinite; animation-delay: calc(var(--c) * -0.14s); }
  .flag i.y { background: #E6C14F; } .flag i.b { background: #4A72CF; }
  @keyframes tremula { 0%, 100% { transform: translateY(-1.6px); } 50% { transform: translateY(1.6px); } }
  .avatar {
    width: clamp(60px, 12vh, 104px); height: clamp(60px, 12vh, 104px); border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent);
  }
  h1 { font-size: 22px; font-weight: 700; margin-top: clamp(10px, 2.2vh, 20px); }
  .sub { font-size: 14px; color: var(--muted); margin-top: 6px; }

  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 12px); margin-top: clamp(16px, 3.5vh, 32px); }
  .link {
    display: flex; align-items: center; gap: 14px; padding: clamp(9px, 1.6vh, 14px) 14px;
    border-radius: 22px; background: var(--surface); color: inherit; text-decoration: none;
    transition: transform .2s ease, background .2s ease;
  }
  .link:hover, .link:focus-visible { background: var(--surface-high); transform: translateY(-2px); outline: none; }
  .link:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .ico { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
  .txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .txt b { font-size: 16px; font-weight: 600; }
  .txt small { font-size: 13px; color: var(--muted); }
  .arrow { color: var(--accent); font-size: 20px; transition: transform .2s ease; }
  .link:hover .arrow { transform: translateX(3px); }

  .i-palavreiro { background: #2A2058; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 10px; }
  .i-palavreiro i { border-radius: 4px; width: 100%; height: 100%; }
  .i-bussola { background: #E6E3DD; }
  .i-cegas { background: #262A35; color: #D8B45A; font-size: 24px; font-weight: 700; }

  footer { margin-top: auto; padding-top: clamp(32px, 5.5vh, 56px); font-size: 13px; color: var(--muted); }
  footer a { display: flex; align-items: center; gap: 10px; min-height: 44px; color: inherit; text-decoration: none; }
  footer a:hover, footer a:focus-visible { color: var(--text); outline: none; }
  .insta { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
  footer a:hover .insta, footer a:focus-visible .insta { background: var(--surface-high); box-shadow: 0 0 0 2px var(--accent); }
  @media (prefers-reduced-motion: reduce) { .flag i { animation: none; } .link, .arrow { transition: none; } .link:hover { transform: none; } }

  /* Mascotes: 5 bichinhos de formas e cores diferentes. Andam, piscam, dormem de 0h a 5h e se assustam ao toque. */
  html, body { overflow-x: clip; }
  .slot { position: relative; }
  .slot .link { position: relative; z-index: 1; }
  footer { position: relative; width: 100%; max-width: 440px; display: flex; justify-content: center; }
  .trilha { position: absolute; left: 0; right: 0; height: 44px; pointer-events: none; }
  .slot .trilha { bottom: 100%; margin-bottom: -2px; z-index: 2; }
  .trilha.chao { bottom: 42px; z-index: 2; }
  .trilha.chao::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 3px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, #23272E 0 7px, transparent 7px 11px); }
  .bicho {
    position: absolute; left: 0; bottom: 0; width: 44px; height: 44px; padding: 0; border: 0; background: none;
    display: flex; align-items: flex-end; justify-content: center; cursor: pointer; pointer-events: auto;
    -webkit-tap-highlight-color: transparent; will-change: transform;
  }
  .bicho:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
  .bicho svg { display: block; width: 28px; height: 31.5px; overflow: visible; }
  .bicho .tronco, .bicho .pe { transform-box: fill-box; transform-origin: 50% 100%; }
  .bicho .fechado, .bicho .susto, .bicho .zzz { display: none; }
  .bicho.pisca .olhos, .bicho.dorme .olhos, .bicho.assustado .olhos, .bicho.assustado .fechado { display: none; }
  .bicho.pisca .fechado, .bicho.dorme .fechado, .bicho.dorme .zzz, .bicho.assustado .susto { display: inline; }
  .bicho.fecha .olhos { display: none; }
  .bicho.fecha .fechado { display: inline; }
  /* Chuva: nuvens e gotas num canvas atrás dos botões, acima do chão dos mascotes */
  .ceu { position: absolute; left: 0; bottom: 42px; width: 100%; height: 40px; pointer-events: none; z-index: 0; }
  .bicho .coracao { display: none; }
  .bicho.amor .olhos, .bicho.amor .fechado { display: none; }
  .bicho.amor .coracao { display: inline; }
  .bicho.amor .coracao path { transform-box: fill-box; transform-origin: center; animation: bate .45s ease-in-out infinite; }
  @keyframes bate { 50% { transform: scale(1.3); } }
  .bicho.espia { left: auto; right: -22px; top: 50%; bottom: auto; margin-top: -22px; z-index: 0; }
  .bicho.espia svg { transform: rotate(14deg); }
</style>

<script>
// Mascotes: movimento suave por física simples (aceleração, passo, respiração), olhar que segue o dedo e susto ao toque.
(() => {
  const F = {
    broto: { topo: 4, pe: "#B8962F", o: [14, 19, 26, 19], c: '<path d="M20 4C19-1 23-4 28-3 27 1 24 3 20 4Z" fill="#5FB873"/><rect x="2" y="4" width="36" height="32" rx="11" fill="#E6C14F"/><circle cx="8.5" cy="26" r="3" fill="#F2A0A0" opacity=".85"/><circle cx="31.5" cy="26" r="3" fill="#F2A0A0" opacity=".85"/>' },
    bola: { topo: 4, pe: "#4A72CF", o: [14, 18, 26, 18], c: '<path d="M20 4q2-6 7-5" fill="none" stroke="#6F95E6" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="20" r="16" fill="#6F95E6"/>' },
    gota: { topo: 0, pe: "#3E8A50", o: [14, 24, 26, 24], c: '<path d="M20 0C27 9 37 16 37 24A17 13 0 0 1 3 24C3 16 13 9 20 0Z" fill="#5FB873"/>' },
    pilula: { topo: 12, pe: "#93B84A", o: [13, 23, 27, 23], c: '<rect x="0" y="12" width="40" height="24" rx="12" fill="#C6F36B"/>' },
    orelhudo: { topo: 6, pe: "#6E5FD0", o: [15, 20, 25, 20], c: '<rect x="8" y="-2" width="6" height="14" rx="3" fill="#9B8CFF"/><rect x="26" y="-2" width="6" height="14" rx="3" fill="#9B8CFF"/><rect x="5" y="6" width="30" height="30" rx="10" fill="#9B8CFF"/>' }
  };
  const desenho = (f) => { const [a, b, c, d] = f.o; return `<svg viewBox="-4 -10 48 54" aria-hidden="true">
    <rect class="pe" x="9" y="34" width="7" height="6" rx="3" fill="${f.pe}"/><rect class="pe" x="24" y="34" width="7" height="6" rx="3" fill="${f.pe}"/>
    <g class="tronco">${f.c}
      <g class="olhos" fill="#101216"><circle cx="${a}" cy="${b}" r="2.6"/><circle cx="${c}" cy="${d}" r="2.6"/></g>
      <g class="coracao" fill="#FF5C7A">${[[a, b], [c, d]].map(([x, y]) => `<path d="M${x} ${y + 3}l-3.4-3.4a2 2 0 0 1 3.4-2.6a2 2 0 0 1 3.4 2.6z"/>`).join("")}</g>
      <path class="fechado" d="M${a - 4} ${b}q4 3.5 8 0M${c - 4} ${d}q4 3.5 8 0" fill="none" stroke="#101216" stroke-width="2.2" stroke-linecap="round"/>
      <g class="susto" fill="#101216"><circle cx="${a}" cy="${b}" r="4.6" fill="#fff"/><circle cx="${c}" cy="${d}" r="4.6" fill="#fff"/><circle cx="${a}" cy="${b}" r="1.5"/><circle cx="${c}" cy="${d}" r="1.5"/><ellipse cx="20" cy="${b + 8}" rx="2.2" ry="2.8"/><path d="M38 0q3 4 0 6.5q-3-2.5 0-6.5Z" fill="#9FD3FF"/></g>
      <g class="zzz" fill="#9AA0AA" font-family="Sora,sans-serif" font-weight="700"><text x="33" y="-2" font-size="8">z</text><text x="38" y="-7" font-size="6">z</text></g>
    </g></svg>`; };
  const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const noite = () => new Date().getHours() < 5;
  const rnd = (a, b) => a + Math.random() * (b - a);
  let px = -1e4, py = -1e4;
  addEventListener("pointermove", (e) => { px = e.clientX; py = e.clientY; }, { passive: true });

  // susto: treme, pula e foge para longe de x (na tela); quem espia se esconde
  const assusta = (m, x) => {
    if (m.estado === "susto" || m.estado === "corre" || m.estado === "briga") return;
    const el = m.el;
    if (reduz) { el.classList.add("assustado"); setTimeout(() => el.classList.remove("assustado"), 700); return; }
    el.classList.remove("dorme", "pisca", "fecha", "amor"); el.classList.add("assustado");
    m.estado = "susto"; m.tS = 0; m.pulou = false; m.sq = 0.6; m.fugaX = x;
  };

  const bichos = [...document.querySelectorAll(".bicho")].map((el, i) => {
    el.innerHTML = desenho(F[el.dataset.forma]);
    const espia = el.classList.contains("espia"), trilha = el.parentElement;
    const faixa = () => {
      if (espia) return [-30, 6];
      const w = trilha.clientWidth;
      return trilha.dataset.faixa === "card" ? [w * 0.42, w - 52] : [0, w - 44];
    };
    const [a, b] = faixa();
    const m = { el, espia, faixa, trilha, svg: el.querySelector("svg"), tronco: el.querySelector(".tronco"), pes: el.querySelectorAll(".pe"), olhos: el.querySelector(".olhos"),
      x: espia ? 6 : a + (b - a) * [0.7, 0.15, 0.5, 0.85][i % 4], alvo: 0, v: 0, vmax: 26, f: 1, face: 1, fase: rnd(0, 6), y: 0, vy: 0, sq: 0, chao: 0,
      estado: "parado", espera: rnd(0.5, 3), tS: 0, pulou: false, cansado: 0, fugaX: 0, acao: "", tA: 0, durA: 0, briga: null };
    m.alvo = m.x;
    el.addEventListener("click", (e) => assusta(m, e.clientX));
    (function piscar() { setTimeout(() => { if (!el.classList.contains("dorme") && !el.classList.contains("assustado")) { el.classList.add("pisca"); setTimeout(() => el.classList.remove("pisca"), 150); } piscar(); }, rnd(2200, 6000)); })();
    return m;
  });

  // Ações aleatórias de quem está parado
  const DUR = { pulinhos: 1.2, espreguica: 1.7, olha: 2.2, danca: 2.2, cochilo: 3.5 };
  const iniciaAcao = (m, n) => {
    m.estado = "acao"; m.acao = n; m.tA = 0; m.ult = -1; m.face0 = m.face || 1; m.durA = DUR[n];
    m.el.classList.toggle("fecha", n === "espreguica");
  };
  const fimAcao = (m) => { m.el.classList.remove("fecha"); m.estado = "parado"; m.acao = ""; m.espera = rnd(1.5, 4); };

  const chaoEl = document.querySelector(".trilha.chao");
  const doChao = bichos.filter((m) => m.trilha === chaoEl);
  const chuva = { fase: "nada", t: 0, prox: rnd(15, 30), dur: 0, nuvens: [], gotas: [], respingos: [] };
  const pausas = new Map();

  // Prefere destinos longe dos vizinhos da mesma faixa; às vezes (15%) aceita ficar perto
  const vizinhos = (m) => bichos.filter((o) => o !== m && o.trilha === m.trilha && !o.espia);
  const escolheAlvo = (m, a, b) => {
    const viz = vizinhos(m), ocupados = viz.flatMap((o) => [o.x, o.alvo]);
    const parados = viz.filter((o) => o.estado !== "anda" && o.estado !== "corre").map((o) => o.x);
    const tolera = Math.random() < 0.15;
    let melhor = rnd(a, b), nota = -1;
    for (let k = 0; k < 14; k++) {
      const n = rnd(a, b);
      if (Math.abs(n - m.x) < 30 && b - a > 60) continue;
      let dist = ocupados.length ? Math.min(...ocupados.map((x) => Math.abs(x - n))) : 1e3;
      // evita passar por cima/na frente de quem está parado no caminho
      if (parados.some((x) => (x - m.x) * (x - n) < 0)) dist = Math.min(dist, 10);
      if (tolera || dist >= 56) return n;
      if (dist > nota) { nota = dist; melhor = n; }
    }
    return melhor;
  };

  const passo = (m, dt, t) => {
    const [a, b] = m.faixa(), el = m.el;
    el.classList.toggle("dorme", ((noite() && m.estado === "parado") || (m.estado === "acao" && m.acao === "cochilo")) && !el.classList.contains("assustado"));
    if (m.estado === "parado") {
      if (chuva.fase === "chove" && m.trilha === chaoEl && m.cansado <= 0) { m.estado = "feliz"; m.alvo = m.x; }
      else if (m.cansado > 0) m.cansado -= dt;
      else if (!el.classList.contains("dorme")) {
        // apertado ao lado de outro? sai mais cedo (com tolerância: espera um pouco antes)
        const perto = !m.espia && vizinhos(m).some((o) => Math.abs(o.x - m.x) < 34);
        if (perto && !m.apertado) { m.apertado = true; m.espera = Math.min(m.espera, rnd(0.8, 2)); }
        if ((m.espera -= dt) <= 0) {
          m.apertado = false;
          if (m.espia) { m.alvo = m.x > -10 ? (Math.random() < 0.5 ? -30 : -10) : 6; m.vmax = 30; m.estado = "anda"; }
          else if (!perto && Math.random() < 0.4) iniciaAcao(m, ["pulinhos", "espreguica", "olha", "danca", "cochilo"][Math.floor(Math.random() * 5)]);
          else { m.alvo = escolheAlvo(m, a, b); m.vmax = rnd(20, 32); m.estado = "anda"; }
        }
      }
    } else if (m.estado === "acao") {
      m.tA += dt;
      if (m.acao === "pulinhos" && m.vy === 0 && m.y === m.chao && m.tA < m.durA - 0.3 && m.tA - m.ult > 0.34) { m.vy = -120; m.sq = -0.45; m.ult = m.tA; }
      if (m.acao === "olha") m.face = Math.floor(m.tA / 0.55) % 2 ? -m.face0 : m.face0;
      if (m.tA > m.durA) fimAcao(m);
    } else if (m.estado === "susto") {
      m.tS += dt;
      if (!m.pulou && m.tS > 0.12) { m.pulou = true; m.vy = -190; m.sq = -0.7; }
      if (m.pulou && m.y === 0 && m.tS > 0.3) {
        const r = el.getBoundingClientRect(), cx = r.left + r.width / 2;
        m.alvo = m.espia ? -30 : (m.fugaX < cx ? b : a); m.vmax = m.espia ? 150 : 165; m.estado = "corre";
      }
    } else if (m.estado === "alegria") {
      // começou a chover: corações nos olhos e pulos altos por um momento
      m.tA += dt;
      if (m.vy === 0 && m.y === m.chao && m.tA < 1.3 && m.tA - m.ult > 0.3) { m.vy = -220; m.sq = -0.6; m.ult = m.tA; }
      if (m.tA > 1.6) { el.classList.remove("amor"); m.estado = "feliz"; m.alvo = m.x; }
    } else if (m.estado === "feliz") {
      // corre de um lado para o outro na chuva, dando pulinhos
      if (chuva.fase !== "chove") { m.estado = "parado"; m.espera = rnd(1, 3); }
      else {
        if (Math.abs(m.alvo - m.x) < 10) { let n; do n = rnd(a, b); while (Math.abs(n - m.x) < 60 && b - a > 120); m.alvo = n; m.vmax = rnd(70, 100); }
        if (m.vy === 0 && m.y === 0 && Math.random() < dt * 0.9) { m.vy = -150; m.sq = -0.4; }
      }
    } else if (m.estado === "briga") {
      const g = m.briga, o = g.outro; g.t += dt;
      if (g.t > 4) { m.estado = "parado"; m.chao = 0; m.briga = null; el.style.zIndex = ""; }
      else if (g.papel === "sobe") {
        if (!g.pulou && g.t > 0.4) { g.pulou = true; m.chao = -((40 - F[o.el.dataset.forma].topo) * 31.5 / 54) + 1; m.vy = -270; m.sq = -0.6; m.v = (o.x - m.x) / 0.45; }
        if (g.pulou && !g.pousou && m.vy === 0 && m.y === m.chao) { g.pousou = g.t; m.v = 0; o.sq = 0.45; }
        if (g.pousou) {
          m.x += (o.x - m.x) * Math.min(1, dt * 12);
          if (g.t - g.pousou > 0.7 && !g.empurrou) {
            g.empurrou = true; m.chao = 0; m.vy = -200; m.v = g.lado * 110;
            o.briga = null; o.estado = "corre"; o.el.classList.add("assustado");
            o.alvo = Math.min(b, Math.max(a, o.x - g.lado * 70)); o.vmax = 150;
          }
        }
        if (g.empurrou && m.vy === 0 && m.y === 0) {
          m.briga = null; el.style.zIndex = ""; m.estado = "corre"; m.alvo = Math.min(b, Math.max(a, m.x + g.lado * 20)); m.vmax = 80;
        }
      }
    }
    if (m.estado === "anda" || m.estado === "corre" || m.estado === "feliz") {
      const dx = m.alvo - m.x, quer = Math.sign(dx) * Math.min(m.vmax, Math.abs(dx) * 3.5);
      m.v += (quer - m.v) * Math.min(1, dt * (m.estado === "anda" ? 4 : 9));
      if (Math.abs(dx) < 0.6 && Math.abs(m.v) < 3) {
        m.x = m.alvo; m.v = 0;
        if (m.estado === "corre") {
          m.cansado = m.espia ? 2.5 : 1.4;
          setTimeout(() => el.classList.remove("assustado"), m.espia ? 2400 : 900);
          if (m.espia) m.espera = 0;
        }
        if (m.estado !== "feliz") { m.estado = "parado"; m.espera = m.espia ? rnd(2, 4) : rnd(1.5, 4.5); }
      }
    } else if (m.estado !== "briga" || !m.briga || !m.briga.pulou) m.v *= Math.exp(-dt * 8);
    m.x += m.v * dt;
    // pulo com gravidade; "chao" sobe quando um bicho está em cima do outro
    if (m.vy || m.y < m.chao - 0.01) { m.vy += 1100 * dt; m.y += m.vy * dt; if (m.y >= m.chao && m.vy >= 0) { m.y = m.chao; m.vy = 0; m.sq = 0.55; } }
    m.sq *= Math.exp(-dt * 9);
    const vel = Math.abs(m.v), anda = m.y < m.chao - 0.5 ? 0 : Math.min(1, vel / 28);
    if (!m.espia && vel > 4 && m.estado !== "briga") m.face = Math.sign(m.v);
    m.f += (m.face - m.f) * Math.min(1, dt * 10);
    m.fase += dt * (5 + vel * 0.22);
    const s = Math.sin(m.fase);
    let resp = (1 - anda) * (m.cansado > 0 ? Math.sin(t * 11) * 0.05 : Math.sin(t * 2.4) * 0.022);
    let bob = -Math.abs(s) * 2.4 * anda, incl = s * 4 * anda + Math.min(12, vel * 0.07);
    let treme = m.estado === "susto" && !m.pulou ? Math.sin(t * 90) * 1.3 : 0;
    if (m.estado === "acao") {
      const e = Math.sin(Math.PI * Math.min(1, m.tA / m.durA));
      if (m.acao === "espreguica") resp += e * 0.2;
      if (m.acao === "danca") { incl += Math.sin(m.tA * 9) * 11 * e; bob -= Math.abs(Math.sin(m.tA * 9)) * 2.5 * e; }
    }
    if (m.estado === "briga" && m.briga) {
      const g = m.briga;
      if (!g.pulou && g.papel === "sobe") treme = Math.sin(t * 60) * 0.8;
      if (g.pousou && !g.empurrou) incl += Math.sin(t * 26) * 9;
    }
    const sx = 1 + m.sq * 0.2 - resp, sy = 1 - m.sq * 0.2 + resp;
    el.style.transform = `translate(${(m.x + treme).toFixed(2)}px, ${m.y.toFixed(2)}px)`;
    m.svg.style.transform = (m.espia ? "rotate(14deg) " : "") + `scaleX(${m.f.toFixed(3)})`;
    m.tronco.style.transform = `translateY(${bob.toFixed(2)}px) rotate(${incl.toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
    m.pes[0].style.transform = `translateY(${(-Math.max(0, s) * 2.6 * anda).toFixed(2)}px)`;
    m.pes[1].style.transform = `translateY(${(-Math.max(0, -s) * 2.6 * anda).toFixed(2)}px)`;
    // olhar: segue o dedo; na briga, olha o outro
    const r = el.getBoundingClientRect(); let tx = px, ty = py;
    if (m.estado === "briga" && m.briga) { const q = m.briga.outro.el.getBoundingClientRect(); tx = q.left + 22; ty = q.top + 30; }
    const ox = tx - (r.left + r.width / 2), oy = ty - (r.top + r.height / 2), d = Math.hypot(ox, oy) || 1;
    const k = tx < -1e3 ? 0 : 1;
    m.olhos.style.transform = `translate(${((ox / d) * 1.7 * k * Math.sign(m.f || 1)).toFixed(2)}px, ${((oy / d) * 1.3 * k).toFixed(2)}px)`;
  };

  // Chuva: de vez em quando chegam nuvens de quadradinhos e chove no chão do rodapé
  const ceu = document.createElement("canvas");
  ceu.className = "ceu"; ceu.setAttribute("aria-hidden", "true");
  chaoEl.parentElement.insertBefore(ceu, chaoEl);
  const g2 = ceu.getContext("2d"), ultimo = document.querySelector("main .slot:last-child .link");
  let H = 40, BASE = 30;
  const suave = (x) => { const k = Math.min(1, Math.max(0, x)); return k * k * (3 - 2 * k); };
  const novaNuvem = (W, i, n) => {
    const w = rnd(70, 100);
    const alvo = (W / (n + 1)) * (i + 1) - w / 2 + rnd(-20, 20);
    const lado = Math.random() < 0.5 ? -1 : 1;
    return { w, alvo, de: lado < 0 ? -w - 10 : W + 10, para: lado < 0 ? W + 10 : -w - 10, x: 0, fase: rnd(0, 6) };
  };
  const chover = (dt, t) => {
    // o céu ocupa o espaço entre o último botão e o chão dos mascotes
    const W = ceu.clientWidth, dpr = devicePixelRatio || 1;
    const vao = Math.max(40, Math.round(chaoEl.getBoundingClientRect().bottom - ultimo.getBoundingClientRect().bottom));
    if (vao !== H) { H = vao; ceu.style.height = H + "px"; }
    BASE = Math.min(H - 12, 14 + 41); // 14px de folga abaixo dos botões + altura da nuvem
    if (ceu.width !== Math.round(W * dpr) || ceu.height !== H * dpr) { ceu.width = Math.round(W * dpr); ceu.height = H * dpr; }
    const c = chuva;
    if (c.fase === "nada") {
      if (noite() || !doChao.length || (c.prox -= dt) > 0) { if (c.limpo) return; }
      else if (Math.random() < 0.5) {
        const n = W > 300 ? 3 : 2;
        c.nuvens = Array.from({ length: n }, (_, i) => novaNuvem(W, i, n)); c.fase = "chega"; c.t = 0; c.dur = rnd(12, 18);
      } else c.prox = rnd(20, 40);
    } else {
      c.t += dt;
      if (c.fase === "chega" && c.t > 1.6) {
        c.fase = "chove"; c.t = 0; c.proxRaio = rnd(3, 6);
        doChao.forEach((m) => {
          if (["parado", "anda", "acao", "feliz"].includes(m.estado)) {
            m.el.classList.remove("fecha", "dorme"); m.el.classList.add("amor");
            m.estado = "alegria"; m.tA = 0; m.ult = -1; m.v *= 0.3;
          }
        });
      } else if (c.fase === "chove" && c.t > c.dur) { c.fase = "vai"; c.t = 0; }
      else if (c.fase === "vai" && c.t > 1.8 && !c.gotas.length) { c.fase = "nada"; c.nuvens = []; c.prox = rnd(30, 60); }
    }
    // relâmpago: de vez em quando sai um raio de uma nuvem e assusta todos os mascotes do site
    if (c.raio) { c.raio.t += dt; if (c.raio.t > 0.35) c.raio = null; }
    if (c.fase === "chove" && (c.proxRaio -= dt) <= 0) {
      c.proxRaio = rnd(4, 9);
      if (Math.random() < 0.6 && c.nuvens.length) {
        const nv = c.nuvens[Math.floor(Math.random() * c.nuvens.length)];
        let rx = nv.x + nv.w * rnd(0.3, 0.7), ry = BASE - 2; const pts = [[rx, ry]];
        while (ry < H) { ry = Math.min(H, ry + rnd(6, 11)); rx += rnd(-7, 7); pts.push([rx, ry]); }
        c.raio = { t: 0, pts };
        const de = document.documentElement;
        de.classList.add("clarao"); setTimeout(() => de.classList.remove("clarao"), 70);
        setTimeout(() => de.classList.add("clarao"), 140); setTimeout(() => de.classList.remove("clarao"), 220);
        const xTela = ceu.getBoundingClientRect().left + pts[0][0];
        bichos.forEach((m) => assusta(m, xTela));
      }
    }
    // gotas e respingos
    if (c.fase === "chove") {
      const taxa = 26 * Math.min(1, c.t / 1.5);
      for (let k = 0; k < taxa * dt * 2; k++) if (Math.random() < 0.5) {
        const nv = c.nuvens[Math.floor(Math.random() * c.nuvens.length)];
        c.gotas.push({ x: nv.x + rnd(4, nv.w - 4), y: BASE, v: rnd(210, 260) });
      }
    }
    c.gotas.forEach((d) => { d.y += d.v * dt; });
    c.gotas = c.gotas.filter((d) => { if (d.y < H) return true; c.respingos.push({ x: d.x, t: 0 }); return false; });
    c.respingos.forEach((r) => (r.t += dt)); c.respingos = c.respingos.filter((r) => r.t < 0.28);
    // desenho
    g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, W, H);
    c.limpo = !c.nuvens.length && !c.gotas.length && !c.respingos.length;
    if (c.limpo) return;
    const luz = c.raio && (c.raio.t < 0.08 || (c.raio.t > 0.14 && c.raio.t < 0.3)) ? 1 : 0;
    const pos = c.fase === "chega" ? suave(c.t / 1.6) : c.fase === "vai" ? 1 + suave(c.t / 1.8) : 1;
    c.nuvens.forEach((nv) => {
      nv.x = pos <= 1 ? nv.de + (nv.alvo - nv.de) * pos : nv.alvo + (nv.para - nv.alvo) * (pos - 1);
      nv.x += Math.sin(t * 0.4 + nv.fase) * 3;
      // N2 · bolhas: base arredondada + três bolhas + brilho; acende no relâmpago
      const x = nv.x, w = nv.w, aceso = luz > 0;
      const bola = (cx, cy, r, cor) => { g2.fillStyle = cor; g2.beginPath(); g2.arc(cx, cy, r, 0, Math.PI * 2); g2.fill(); };
      g2.fillStyle = aceso ? "#5C6472" : "#434A55"; g2.beginPath(); g2.roundRect(x, BASE - 18, w, 18, 9); g2.fill();
      bola(x + w * 0.25, BASE - 18, w * 0.15, aceso ? "#646C7A" : "#4A515D");
      bola(x + w * 0.5, BASE - 22, w * 0.19, aceso ? "#6A7280" : "#4E5562");
      bola(x + w * 0.76, BASE - 17, w * 0.13, aceso ? "#646C7A" : "#4A515D");
      g2.globalAlpha = 0.7; bola(x + w * 0.46, BASE - 27, w * 0.08, aceso ? "#8A92A0" : "#5A6270"); g2.globalAlpha = 1;
    });
    g2.fillStyle = "#7FB8F0";
    c.gotas.forEach((d) => { g2.beginPath(); g2.roundRect(d.x - 1, d.y - 7, 2, 7, 1); g2.fill(); });
    c.respingos.forEach((r) => {
      const k = r.t / 0.28; g2.globalAlpha = 1 - k;
      g2.fillRect(r.x - 2 - k * 5, H - 2 - k * 4, 2, 2); g2.fillRect(r.x + k * 5, H - 2 - k * 4, 2, 2);
      g2.globalAlpha = 1;
    });
    if (luz) {
      g2.save(); g2.strokeStyle = "#E6C14F"; g2.lineWidth = 3; g2.lineJoin = "round"; g2.lineCap = "round";
      g2.shadowColor = "#E6C14F"; g2.shadowBlur = 10; g2.beginPath();
      c.raio.pts.forEach(([px2, py2], k) => (k ? g2.lineTo(px2, py2) : g2.moveTo(px2, py2))); g2.stroke(); g2.restore();
    }
  };

  // Briga: dois bichos do rodapé se encontram, um sobe no outro e empurra
  const brigas = (t) => {
    if (chuva.fase !== "nada") return; // na chuva ninguém briga
    for (let i = 0; i < doChao.length; i++) for (let j = i + 1; j < doChao.length; j++) {
      const p = doChao[i], q = doChao[j], chave = i + "-" + j;
      if ((pausas.get(chave) || 0) > t || noite()) continue;
      if (!["parado", "anda"].includes(p.estado) || !["parado", "anda"].includes(q.estado)) continue;
      if (Math.abs(p.x - q.x) > 30) continue;
      if (Math.random() < 0.7) { pausas.set(chave, t + 10); continue; }
      pausas.set(chave, t + 40);
      const [s1, s2] = Math.random() < 0.5 ? [p, q] : [q, p];
      const lado = Math.sign(s1.x - s2.x) || 1;
      s1.face = -lado; s2.face = lado; s1.v = s2.v = 0;
      s1.estado = s2.estado = "briga"; s1.el.style.zIndex = 3;
      s1.briga = { papel: "sobe", t: 0, outro: s2, lado };
      s2.briga = { papel: "base", t: 0, outro: s1 };
    }
  };

  let ant = performance.now();
  const loop = (agora) => {
    const dt = Math.min(0.05, (agora - ant) / 1000), t = agora / 1000; ant = agora;
    brigas(t); chover(dt, t);
    bichos.forEach((m) => passo(m, dt, t));
    requestAnimationFrame(loop);
  };
  if (reduz) bichos.forEach((m) => { m.el.style.transform = `translateX(${m.x}px)`; m.el.classList.toggle("dorme", noite()); });
  else requestAnimationFrame(loop);
})();
</script>
